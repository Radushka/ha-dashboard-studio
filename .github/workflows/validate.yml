# Checks the integration the way Home Assistant and the Marketplace (formerly HACS) do.
# The license check is skipped: the code has its own license, not an open-source one.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Our own license keeps all rights (Radu, 2026-11-03), so the open-source license check is skipped.
          # This means the default Marketplace catalogue is not open to us; users add the repository by link.
          ignore: license
