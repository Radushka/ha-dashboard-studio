<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script>
      // On a TV (the wall app says " TV"), the web view reports only 960 px, so everything looks twice as big.
      // Lay the page out wider instead: the app's "Size on the TV" (" TV/1280"), 1280 by default; ?tvwidth= tries another.
      (function () {
        var m = /DashboardStudioWall\/\S+ TV(?:\/(\d+))?/.exec(navigator.userAgent);
        if (!m) return;
        // " TV/1280 studio" means "As in the studio": 1280 until the layout names the screen's preview width (App.svelte).
        // A width below 800 is never real, so it falls back to 1280 too.
        var w = Number(new URLSearchParams(location.search).get("tvwidth")) || Number(m[1]) || 1280;
        if (w < 800) w = 1280;
        document.querySelector('meta[name="viewport"]').setAttribute("content", "width=" + w + ", user-scalable=no");
      })();
    </script>
    <meta name="theme-color" content="#0d0f14" />
    <title>Home</title>
    <!-- "Add to Home Screen" on iPhone, iPad and Android opens the dashboard full screen, like an app. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  </head>
